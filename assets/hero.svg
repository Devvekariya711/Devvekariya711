<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680">
<defs>
  <!-- Grid pattern -->
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#585C62" stroke-opacity=".08"/>
  </pattern>

  <!-- Amber gradient -->
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F4A900"/>
    <stop offset="1" stop-color="#FFCA28"/>
  </linearGradient>

  <!-- Radial glow for portrait circle -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFCA28" stop-opacity=".5"/>
    <stop offset="70%" stop-color="#F4A900" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#F4A900" stop-opacity="0"/>
  </radialGradient>

  <!-- Portrait clip and shadow -->
  <clipPath id="portraitClip"><circle cx="1035" cy="340" r="275"/></clipPath>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".18"/></filter>

  <!-- Reveal mask — wipes left-to-right over 2.4s -->
  <mask id="reveal">
    <rect width="0" height="680" fill="white">
      <animate attributeName="width" from="0" to="1400" dur="2.4s" fill="freeze"/>
    </rect>
  </mask>

  <!-- Noise texture filter -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
  </filter>
</defs>

<!-- Background -->
<rect width="1400" height="680" fill="#EBECEF"/>
<rect width="1400" height="680" fill="url(#grid)"/>
<rect width="1400" height="680" filter="url(#noise)" opacity=".4"/>

<!-- Left accent bar with fade-in -->
<rect x="60" y="54" width="14" height="290" fill="#F4A900" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze"/>
</rect>

<!-- Portrait circle glow ring — pulsing -->
<circle cx="1035" cy="340" r="310" fill="url(#glow)" opacity="0">
  <animate attributeName="opacity" values="0;.6;.4;.6" dur="4s" begin="0.5s" fill="freeze"/>
  <animate attributeName="r" values="310;320;310" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- Portrait circle background -->
<g filter="url(#shadow)">
  <circle cx="1035" cy="340" r="300" fill="url(#amber)"/>
  <circle cx="1035" cy="340" r="274" fill="#FFCA28" opacity=".28"/>
</g>

<!-- Portrait image — masked with reveal animation -->
<g clip-path="url(#portraitClip)" mask="url(#reveal)">
  <image href="portrait-side.png" x="730" y="30" width="610" height="915" preserveAspectRatio="xMidYMid slice"/>
</g>

<!-- Floating particles -->
<g fill="#F4A900">
  <circle cx="180" cy="420" r="2.5" opacity="0">
    <animate attributeName="opacity" values="0;.6;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="420;400;420" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="340" cy="180" r="1.8" opacity="0">
    <animate attributeName="opacity" values="0;.5;0" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="180;160;180" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="520" cy="580" r="2" opacity="0">
    <animate attributeName="opacity" values="0;.4;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="580;560;580" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="650" cy="120" r="1.5" opacity="0">
    <animate attributeName="opacity" values="0;.55;0" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cx" values="650;660;650" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="280" cy="600" r="2.2" opacity="0">
    <animate attributeName="opacity" values="0;.35;0" dur="3.8s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cy" values="600;585;600" dur="3.8s" repeatCount="indefinite" begin="3s"/>
  </circle>
</g>

<!-- Main text — staggered fade-in -->
<g font-family="'Segoe UI', Arial, Helvetica, sans-serif" fill="#121315">
  <!-- Name line 1 -->
  <text x="105" y="168" font-size="92" font-weight="900" letter-spacing="-4" opacity="0">
    DEV
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
  </text>
  <!-- Name line 2 -->
  <text x="105" y="258" font-size="92" font-weight="900" letter-spacing="-4" opacity="0">
    VEKARIYA
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
  </text>
  <!-- Subtitle -->
  <text x="110" y="306" font-size="22" font-weight="700" letter-spacing="6" opacity="0">
    ENGINEERING / AI / AUTOMATION
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/>
  </text>
  <!-- Tagline -->
  <text x="110" y="345" font-size="14" letter-spacing="3" fill="#585C62" opacity="0">
    EDGE ARCHITECT — BUILD / BREAK / REBUILD
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Status block -->
  <text x="110" y="570" font-size="15" font-weight="700" letter-spacing="4" opacity="0">
    SYSTEM STATUS
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
  </text>
  <text x="110" y="604" font-size="32" font-weight="900" opacity="0">
    BUILDING THINGS THAT MOVE
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.8s" fill="freeze"/>
  </text>
  <text x="110" y="630" font-size="13" letter-spacing="2" fill="#585C62" opacity="0">
    AI · DEVTOOLS · RAG · AGENTS · CREATIVE SYSTEMS
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
  </text>
</g>

<!-- Corner accents -->
<g stroke="#121315" stroke-width="3" fill="none" opacity="0">
  <animate attributeName="opacity" from="0" to=".8" dur="0.5s" begin="2.2s" fill="freeze"/>
  <path d="M1200 70H1325V195"/>
  <path d="M1130 560H1270V420"/>
  <path d="M80 470H200"/>
</g>

<!-- Dot grid decoration -->
<g fill="#121315" opacity="0">
  <animate attributeName="opacity" from="0" to=".85" dur="0.4s" begin="2.4s" fill="freeze"/>
  <circle cx="95" cy="490" r="4"/><circle cx="112" cy="490" r="4"/><circle cx="129" cy="490" r="4"/>
  <circle cx="95" cy="508" r="4"/><circle cx="112" cy="508" r="4"/><circle cx="129" cy="508" r="4"/>
</g>

<!-- Build counter -->
<g font-family="monospace" font-size="14" fill="#121315" opacity="0">
  <animate attributeName="opacity" from="0" to=".65" dur="0.4s" begin="2.5s" fill="freeze"/>
  <text x="1220" y="622">01 / 09</text>
  <text x="1220" y="642">PROFILE.EXE</text>
</g>

<!-- Animated scan line -->
<line x1="60" y1="0" x2="60" y2="680" stroke="#F4A900" stroke-width="1" opacity="0">
  <animate attributeName="opacity" values="0;.3;0" dur="3s" begin="2.4s" repeatCount="indefinite"/>
  <animate attributeName="x1" values="60;1400;60" dur="6s" begin="2.4s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="60;1400;60" dur="6s" begin="2.4s" repeatCount="indefinite"/>
</line>
</svg>

