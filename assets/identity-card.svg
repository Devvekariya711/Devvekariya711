<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%">
<defs>
  <linearGradient id="idAmber" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F4A900"/>
    <stop offset="50%" stop-color="#FFCA28"/>
    <stop offset="100%" stop-color="#D98200"/>
  </linearGradient>

  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#121315"/>
    <stop offset="100%" stop-color="#1a1c20"/>
  </linearGradient>

  <pattern id="idGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#585C62" stroke-width="0.7" stroke-opacity="0.15"/>
  </pattern>

  <clipPath id="frontPortraitClip">
    <circle cx="210" cy="240" r="160"/>
  </clipPath>

  <filter id="glowFilter">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="cardShadow">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

<!-- Card Outer Base -->
<rect width="1200" height="480" rx="24" fill="url(#cardBg)" filter="url(#cardShadow)"/>
<rect width="1200" height="480" rx="24" fill="url(#idGrid)"/>
<rect x="0" y="0" width="1200" height="480" rx="24" fill="none" stroke="#30343a" stroke-width="2"/>

<!-- Animated Glowing Border Accent -->
<rect x="2" y="2" width="1196" height="476" rx="22" fill="none" stroke="#F4A900" stroke-width="1.5" stroke-dasharray="120 400" opacity="0.8">
  <animate attributeName="stroke-dashoffset" from="0" to="1040" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- Left Side: Front Portrait Avatar Frame -->
<g transform="translate(20, 0)">
  <!-- Outer Glow Ring -->
  <circle cx="210" cy="240" r="176" fill="none" stroke="#F4A900" stroke-width="2" stroke-dasharray="12 8" opacity="0.65">
    <animateTransform attributeName="transform" type="rotate" from="0 210 240" to="360 210 240" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="210" cy="240" r="188" fill="none" stroke="#FFCA28" stroke-width="1" stroke-dasharray="4 14" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="360 210 240" to="0 210 240" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- Solid Backing Circle -->
  <circle cx="210" cy="240" r="168" fill="url(#idAmber)"/>

  <!-- Image Avatar -->
  <g clip-path="url(#frontPortraitClip)">
    <image href="portrait-front.png" x="50" y="80" width="320" height="320" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Online Pulse Badge -->
  <circle cx="330" cy="350" r="16" fill="#121315"/>
  <circle cx="330" cy="350" r="11" fill="#39D353" filter="url(#glowFilter)">
    <animate attributeName="r" values="9;12;9" dur="2s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Right Side: Identity Telemetry & Bio Matrix -->
<g transform="translate(450, 50)" font-family="'JetBrains Mono', 'Segoe UI', monospace">
  
  <!-- Header Moniker -->
  <rect width="180" height="26" rx="4" fill="#F4A900" fill-opacity="0.15"/>
  <text x="12" y="18" font-size="11" font-weight="700" fill="#F4A900" letter-spacing="2">AUTHENTICATED ID</text>
  <text x="560" y="18" font-size="11" fill="#585C62" text-anchor="end">SYS // DEV_01</text>
  <line x1="0" y1="36" x2="560" y2="36" stroke="#30343a" stroke-width="1.5"/>

  <!-- Name & Handle -->
  <text x="0" y="80" font-size="34" font-weight="900" fill="#EBECEF" font-family="'Segoe UI', sans-serif">DEV VEKARIYA</text>
  <text x="0" y="108" font-size="14" font-weight="600" fill="#FFCA28" letter-spacing="1">@Devvekariya711 • Full-Stack AI Engineer</text>

  <!-- Summary Paragraph -->
  <text x="0" y="145" font-size="13" fill="#9BA1A7" font-family="'Segoe UI', sans-serif">
    <tspan x="0" dy="0">Specializing in autonomous multi-agent software architecture, low-latency</tspan>
    <tspan x="0" dy="20">AI tooling, voice &amp; speech synthesis, and real-time developer workflows.</tspan>
  </text>

  <!-- 4 Metrics Chips -->
  <g transform="translate(0, 195)">
    <!-- Chip 1 -->
    <rect width="130" height="58" rx="8" fill="#1e2126" stroke="#30343a" stroke-width="1"/>
    <text x="14" y="24" font-size="10" fill="#9BA1A7">BUG MITIGATION</text>
    <text x="14" y="46" font-size="18" font-weight="800" fill="#39D353">74%</text>

    <!-- Chip 2 -->
    <g transform="translate(142, 0)">
      <rect width="130" height="58" rx="8" fill="#1e2126" stroke="#30343a" stroke-width="1"/>
      <text x="14" y="24" font-size="10" fill="#9BA1A7">SPEED MULTIPLIER</text>
      <text x="14" y="46" font-size="18" font-weight="800" fill="#FFCA28">240X</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(284, 0)">
      <rect width="130" height="58" rx="8" fill="#1e2126" stroke="#30343a" stroke-width="1"/>
      <text x="14" y="24" font-size="10" fill="#9BA1A7">REPOSITORIES</text>
      <text x="14" y="46" font-size="18" font-weight="800" fill="#EBECEF">12+</text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(426, 0)">
      <rect width="130" height="58" rx="8" fill="#1e2126" stroke="#30343a" stroke-width="1"/>
      <text x="14" y="24" font-size="10" fill="#9BA1A7">ARCHITECTURE</text>
      <text x="14" y="46" font-size="18" font-weight="800" fill="#F4A900">AGENTS</text>
    </g>
  </g>

  <!-- Live Audio / System Frequency Wave -->
  <g transform="translate(0, 285)">
    <text x="0" y="16" font-size="10" fill="#585C62" letter-spacing="2">SYSTEM FREQUENCY HARMONIC</text>
    <g transform="translate(220, 12)" stroke="#F4A900" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="0"><animate attributeName="y1" values="-6;-14;-4;-10;-6" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="6;14;4;10;6" dur="0.9s" repeatCount="indefinite"/></line>
      <line x1="12" y1="0" x2="12" y2="0"><animate attributeName="y1" values="-12;-4;-14;-6;-12" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y2" values="12;4;14;6;12" dur="0.8s" repeatCount="indefinite"/></line>
      <line x1="24" y1="0" x2="24" y2="0"><animate attributeName="y1" values="-4;-12;-8;-14;-4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y2" values="4;12;8;14;4" dur="1.1s" repeatCount="indefinite"/></line>
      <line x1="36" y1="0" x2="36" y2="0"><animate attributeName="y1" values="-14;-8;-4;-12;-14" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y2" values="14;8;4;12;14" dur="0.85s" repeatCount="indefinite"/></line>
      <line x1="48" y1="0" x2="48" y2="0"><animate attributeName="y1" values="-8;-14;-10;-4;-8" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y2" values="8;14;10;4;8" dur="1.0s" repeatCount="indefinite"/></line>
      <line x1="60" y1="0" x2="60" y2="0"><animate attributeName="y1" values="-10;-4;-12;-14;-10" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y2" values="10;4;12;14;10" dur="0.95s" repeatCount="indefinite"/></line>
      <line x1="72" y1="0" x2="72" y2="0"><animate attributeName="y1" values="-6;-10;-14;-4;-6" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y2" values="6;10;14;4;6" dur="1.15s" repeatCount="indefinite"/></line>
    </g>
  </g>
</g>
</svg>

