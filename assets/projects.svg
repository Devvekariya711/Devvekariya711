<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F4A900"/><stop offset="1" stop-color="#FFCA28"/>
  </linearGradient>
  <filter id="cardGlow">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F4A900" flood-opacity=".15"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="520" rx="28" fill="#EBECEF"/>

<g font-family="'Segoe UI', Arial, Helvetica, sans-serif">

  <!-- Card 1: LinguaBridge — dark card with amber accent bar -->
  <g transform="translate(35 35)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="35 55" to="35 35" dur="0.6s" begin="0.2s" fill="freeze"/>
    <rect width="540" height="205" rx="18" fill="#121315" filter="url(#cardGlow)"/>
    <rect x="18" y="18" width="6" height="169" fill="#F4A900" rx="3">
      <animate attributeName="height" from="0" to="169" dur="0.8s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="46" y="58" font-size="28" font-weight="900" fill="#EBECEF">LINGUABRIDGE</text>
    <text x="46" y="88" font-size="13" fill="#9BA1A7">OFFLINE REAL-TIME VOICE TRANSLATION</text>
    <text x="46" y="128" font-size="11" fill="#FFCA28" letter-spacing="1">WHISPER · NMT · TTS · KIVY</text>
    <text x="46" y="168" font-size="12" fill="#9BA1A7" font-family="monospace">BUILD_01</text>
    <!-- Pulse dot -->
    <circle cx="510" cy="28" r="5" fill="#F4A900" opacity=".7">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;.9;.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 2: Automated DevOps Agent — amber card -->
  <g transform="translate(625 35)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="625 55" to="625 35" dur="0.6s" begin="0.5s" fill="freeze"/>
    <rect width="540" height="205" rx="18" fill="url(#amberGrad)"/>
    <text x="28" y="58" font-size="26" font-weight="900" fill="#121315">AUTOMATED DEVOPS AGENT</text>
    <text x="28" y="88" font-size="13" fill="#121315" opacity=".72">AUTOMATION-FIRST DEVELOPER TOOLING</text>
    <text x="28" y="128" font-size="11" fill="#121315" letter-spacing="1">AI · PYTHON · DEVOPS · WORKFLOWS</text>
    <text x="28" y="168" font-size="12" fill="#121315" opacity=".7" font-family="monospace">BUILD_02</text>
    <!-- Corner bracket -->
    <path d="M490 18H522V50" stroke="#121315" stroke-width="2" fill="none" opacity=".4"/>
  </g>

  <!-- Card 3: AI Development Workflow — slate card -->
  <g transform="translate(35 275)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="35 295" to="35 275" dur="0.6s" begin="0.8s" fill="freeze"/>
    <rect width="540" height="205" rx="18" fill="#585C62"/>
    <text x="28" y="58" font-size="27" font-weight="900" fill="#EBECEF">AI DEVELOPMENT WORKFLOW</text>
    <text x="28" y="88" font-size="13" fill="#EBECEF" opacity=".78">AI INSIDE THE SOFTWARE BUILD LOOP</text>
    <text x="28" y="128" font-size="11" fill="#FFCA28" letter-spacing="1">AGENTS · WORKFLOW · EXPERIMENTS</text>
    <text x="28" y="168" font-size="12" fill="#EBECEF" opacity=".7" font-family="monospace">BUILD_03</text>
    <!-- Mini progress bar -->
    <rect x="28" y="182" width="120" height="3" rx="1.5" fill="#9BA1A7" opacity=".3"/>
    <rect x="28" y="182" width="0" height="3" rx="1.5" fill="#FFCA28">
      <animate attributeName="width" from="0" to="85" dur="1.5s" begin="1.5s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 4: BeatSync — dark card with amber accent line -->
  <g transform="translate(625 275)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="625 295" to="625 275" dur="0.6s" begin="1.1s" fill="freeze"/>
    <rect width="540" height="205" rx="18" fill="#121315" filter="url(#cardGlow)"/>
    <rect x="28" y="31" width="55" height="4" fill="#F4A900" rx="2">
      <animate attributeName="width" from="0" to="55" dur="0.6s" begin="1.4s" fill="freeze"/>
    </rect>
    <text x="28" y="72" font-size="32" font-weight="900" fill="#EBECEF">BEATSYNC</text>
    <text x="28" y="102" font-size="13" fill="#9BA1A7">MEDIA + AUDIO SYNCHRONISATION</text>
    <text x="28" y="142" font-size="11" fill="#FFCA28" letter-spacing="1">PYTHON · AUDIO · AUTOMATION</text>
    <text x="28" y="176" font-size="12" fill="#9BA1A7" font-family="monospace">BUILD_04</text>
    <!-- Audio wave visualization -->
    <g transform="translate(420 150)" stroke="#F4A900" stroke-width="2" opacity=".5">
      <line x1="0" y1="0" x2="0" y2="0"><animate attributeName="y1" values="-8;-4;-10;-6;-8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="8;4;10;6;8" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="8" y1="0" x2="8" y2="0"><animate attributeName="y1" values="-5;-10;-6;-8;-5" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="5;10;6;8;5" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="16" y1="0" x2="16" y2="0"><animate attributeName="y1" values="-10;-6;-4;-10;-10" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="10;6;4;10;10" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="24" y1="0" x2="24" y2="0"><animate attributeName="y1" values="-6;-8;-10;-4;-6" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="6;8;10;4;6" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="32" y1="0" x2="32" y2="0"><animate attributeName="y1" values="-8;-5;-7;-10;-8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="8;5;7;10;8" dur="1.2s" repeatCount="indefinite"/></line>
    </g>
  </g>
</g>

<!-- Scanning amber dot — traverses the entire grid -->
<circle cx="18" cy="18" r="5" fill="#F4A900" opacity="0">
  <animate attributeName="opacity" values="0;.8;.8;0" dur="7s" repeatCount="indefinite" keyTimes="0;0.05;0.95;1"/>
  <animate attributeName="cx" values="18;1180;1180;18;18" dur="7s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>
  <animate attributeName="cy" values="18;18;500;500;18" dur="7s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"/>
</circle>

<!-- Scanning dot trail -->
<circle cx="18" cy="18" r="3" fill="#FFCA28" opacity="0">
  <animate attributeName="opacity" values="0;.4;.4;0" dur="7s" repeatCount="indefinite" keyTimes="0;0.05;0.95;1" begin="0.15s"/>
  <animate attributeName="cx" values="18;1180;1180;18;18" dur="7s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" begin="0.15s"/>
  <animate attributeName="cy" values="18;18;500;500;18" dur="7s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" begin="0.15s"/>
</circle>

<!-- Section label -->
<text x="1050" y="512" font-family="monospace" font-size="11" fill="#585C62" opacity=".6">PROJECT ARCHIVE // 04</text>
</svg>

