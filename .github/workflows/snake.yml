name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake game from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Devvekariya711
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=F4A900&color_dots=#121315,#F4A900,#FFCA28,#585C62,#9BA1A7
            dist/snake-light.svg?palette=github&color_snake=121315&color_dots=#EBECEF,#FFCA28,#F4A900,#585C62,#121315

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

