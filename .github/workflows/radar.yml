name: Refresh Charts and Cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar-skills

      - name: Generate language radar
        run: |
          python scripts/radar.py --github ${{ github.repository_owner }} \
            -o assets/radar-langs --limit 7 --values --curve 0.4 \
            --exclude "shell,makefile,dockerfile,batchfile,procfile"
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Generate cards
        run: python scripts/cards.py --user ${{ github.repository_owner }} --out assets
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: refresh charts and cards [skip ci]" || exit 0
          git push
